<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content calendar — NPrep</title>
<meta name="description" content="What NPrep marketing is shipping, campaign by campaign.">
<meta name="theme-color" content="#131B63">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23131B63'/><circle cx='16' cy='16' r='5' fill='%2315CAE8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to calendar</a>

<header class="topbar">
  <div class="wrap topbar-main">
    <div class="logo"><span class="brandmark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2m2 0h2m-6 3h2"/></svg></span><span>Content calendar<small>NPrep workspace</small></span></div>
    <button id="team-manage" class="team-manage" aria-label="Team members" hidden><span class="team-label-wide">Team members</span><span class="team-label-short">Team</span></button>
    <div class="account">
      <button class="who" id="who" aria-label="Your account" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu" hidden></button>
      <div class="account-menu" id="account-menu" hidden></div>
    </div>
  </div>
  <div class="wrap"><nav class="vsw" id="vsw" role="tablist" aria-label="Calendar views"></nav></div>
</header>

<main class="wrap" id="workspace">
  <div id="head"></div>
  <div id="main" tabindex="-1"></div>
</main>
<div id="overlay"></div>
<div id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="gate" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
